<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — Pocket Breath Coach</title>

    <!-- Keep error pages out of the search index; the HTTP 404 status still tells
         crawlers the URL is gone (GitHub Pages serves this file with a real 404). -->
    <meta name="robots" content="noindex">

    <!-- App Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="https://pocketbreathcoach.com/apple-touch-icon.png">
    <link rel="icon" type="image/x-icon" href="/logo.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-orange: #FF7A3D;
            --primary-orange-hover: #FF5100;
            --white: #FFFFFF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Lato', sans-serif;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.9);
            background: linear-gradient(129deg, #50336d 0%, #2c71e8 50%, #e5e7eb 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1, h2 {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            color: var(--white);
            line-height: 1.2;
        }

        /* Header */
        .header { padding: 20px; text-align: center; }
        .header img { height: 56px; width: auto; }

        /* Centered content */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px 24px 60px;
        }

        /* Breathing ring behind the 404 — ties the page to the app */
        .breathe {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }

        .breathe::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0) 70%);
            border: 2px solid rgba(255, 255, 255, 0.35);
            animation: breathe 8s ease-in-out infinite;
        }

        .breathe .code {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 3.4rem;
            color: var(--white);
            letter-spacing: 2px;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(0.7); opacity: 0.6; }
            50%      { transform: scale(1);   opacity: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            .breathe::before { animation: none; transform: scale(1); }
        }

        h1 { font-size: 2rem; margin-bottom: 14px; }

        p.sub {
            font-size: 1.1rem;
            max-width: 460px;
            margin-bottom: 32px;
            color: rgba(255, 255, 255, 0.9);
        }

        .cta {
            display: inline-block;
            background: var(--primary-orange);
            color: var(--white);
            text-decoration: none;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 15px 38px;
            border-radius: 14px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.28);
            transition: background 0.15s ease, transform 0.3s ease;
        }
        .cta:hover { background: var(--primary-orange-hover); transform: translateY(-2px); }

        .install-label {
            margin-top: 44px;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.85);
        }

        .badges {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 14px;
        }
        .badges img {
            height: 54px;
            width: auto;
            transition: transform 0.3s ease;
        }
        .badges a:hover img { transform: translateY(-2px); }

        .foot-links {
            margin-top: 40px;
            font-size: 0.9rem;
        }
        .foot-links a {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            margin: 0 10px;
        }
        .foot-links a:hover { color: var(--white); text-decoration: underline; }

        @media (max-width: 480px) {
            .breathe { width: 150px; height: 150px; }
            .breathe .code { font-size: 2.8rem; }
            h1 { font-size: 1.6rem; }
            p.sub { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="/"><img src="/textlogo.png" alt="Pocket Breath Coach"></a>
    </header>

    <main>
        <div class="breathe"><span class="code">404</span></div>

        <h1>This page slipped away</h1>
        <p class="sub">The page you're looking for doesn't exist or has moved. Take a breath — everything else is right where you left it.</p>

        <a class="cta" href="/">Back to home</a>

        <p class="install-label">Or start breathing easier today:</p>
        <div class="badges">
            <a href="https://apps.apple.com/us/app/pocket-breath-coach/id6444422222?pt=2104604&amp;ct=404" target="_blank" rel="noopener">
                <img src="/app-store.png" alt="Download on the App Store">
            </a>
            <a href="https://play.google.com/store/apps/details?id=com.headfulness.pocket_breath_coach&amp;referrer=utm_campaign%3D404" target="_blank" rel="noopener">
                <img src="/google-play.png" alt="Get it on Google Play">
            </a>
        </div>

        <nav class="foot-links">
            <a href="/">Home</a>
            <a href="/privacy/">Privacy Policy</a>
            <a href="/terms/">Terms of Service</a>
        </nav>
    </main>
</body>
</html>
